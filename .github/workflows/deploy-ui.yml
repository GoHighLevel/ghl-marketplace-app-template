name: Deploy Sales UI (Cloud Run)

on:
  push:
    branches: [ "main" ]
    paths:
      - "ui/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hooker-e431f
  REGION: us-central1
  SERVICE: ghl-app-ui
  IMAGE: us-central1-docker.pkg.dev/hooker-e431f/containers/ghl-app-ui

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/hooker-e431f/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@hooker-e431f.iam.gserviceaccount.com"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push container
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" "ui"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated
